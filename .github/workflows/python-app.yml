# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [ '3.8', '3.10', '3.12', '3.14' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install dependencies
        # Create the venv with the stdlib `venv` module: Poetry reuses an existing
        # in-project .venv instead of building one with `virtualenv`, whose recent
        # releases no longer seed pip/setuptools for Python 3.8.
        run: |
          python -m venv .venv
          poetry install --no-interaction
      - name: Test with pytest
        run: poetry run pytest
